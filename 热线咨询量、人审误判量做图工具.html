<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热线数据折线图生成器 (Excel版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-6 font-sans text-gray-800">

    <div class="max-w-6xl mx-auto space-y-6">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center text-center">
            <h1 class="text-2xl font-bold mb-2" style="color: #2e95db;">热线咨询量与误判量可视化工具 (Excel版)</h1>
            <p class="text-gray-500 text-sm">请上传您的 Excel (.xlsx/.xls) 文件。工具将自动读取第一个工作表的数据并生成图表。</p>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">1. 上传 咨询与申诉量.xlsx</label>
                <input type="file" id="consultFile" accept=".xlsx, .xls, .csv" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-[#2e95db] file:text-white hover:file:bg-[#1a7bbd] cursor-pointer border border-gray-200 rounded-md">
            </div>
            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">2. 上传 误判量.xlsx</label>
                <input type="file" id="misjudgeFile" accept=".xlsx, .xls, .csv" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-[#2e95db] file:text-white hover:file:bg-[#1a7bbd] cursor-pointer border border-gray-200 rounded-md">
            </div>
            <div class="col-span-1 md:col-span-2 flex flex-col items-center mt-4">
                <div class="flex flex-col md:flex-row space-y-3 md:space-y-0 md:space-x-4 w-full md:w-auto">
                    <button id="generateBtn" class="px-8 py-3 bg-[#2e95db] text-white font-bold rounded-lg shadow-md hover:bg-[#1a7bbd] transition duration-200 w-full md:w-auto">
                        一键生成图表
                    </button>
                    <button id="batchDownloadBtn" class="hidden px-8 py-3 bg-green-500 text-white font-bold rounded-lg shadow-md hover:bg-green-600 transition duration-200 w-full md:w-auto">
                        批量下载全部图表 (ZIP)
                    </button>
                </div>
                <p id="statusMsg" class="mt-3 text-sm text-red-500 hidden"></p>
            </div>
        </div>

        <div id="countryNav" class="flex flex-wrap gap-2 justify-center mt-4"></div>

        <div id="chartsContainer" class="flex flex-wrap gap-8 justify-center mt-4"></div>
    </div>

    <script>
        const THEME_BLUE = '#2e95db';
        const MACHINE_COLOR = '#f97316'; // 橙色，用于机审误判
        const HUMAN_COLOR = '#eab308';   // 黄色，用于人审误判
        let generatedCharts = [];

        // 辅助函数：模糊匹配列名，支持多列名匹配
        function getColumnValue(row, keywords) {
            if (!Array.isArray(keywords)) keywords = [keywords];
            
            const keys = Object.keys(row);
            for (let keyword of keywords) {
                const key = keys.find(k => k.trim().includes(keyword));
                if (key) return row[key];
            }
            return undefined;
        }

        // ✨ 新增核心：智能日期格式化函数，兼容 Excel 序列号和多种字符串
        function formatExcelDate(rawValue) {
            if (rawValue === undefined || rawValue === null || rawValue === "") return "";
            
            // 1. 处理 Excel 导出的纯数字日期（序列号，例如 46055 代表 2026/2/2）
            if (typeof rawValue === 'number' || (typeof rawValue === 'string' && !isNaN(Number(rawValue)) && Number(rawValue) > 10000)) {
                const serial = Number(rawValue);
                // Excel 序列号转 JS 日期 (基于 1900-01-01，使用 UTC 防时区偏移)
                const date = new Date(Math.round((serial - 25569) * 86400 * 1000));
                const month = String(date.getUTCMonth() + 1).padStart(2, '0');
                const day = String(date.getUTCDate()).padStart(2, '0');
                return `${month}/${day}`;
            }
            
            // 2. 处理字符串格式 (如 "2026/2/2", "2026-02-02", "2026-02-02~2026-02-08")
            let dateStr = String(rawValue).trim();
            if (dateStr.includes('~')) dateStr = dateStr.split('~')[0].trim();
            if (dateStr.includes(' ')) dateStr = dateStr.split(' ')[0];
            
            dateStr = dateStr.replace(/\//g, '-');
            const parts = dateStr.split('-');
            
            if (parts.length >= 3) {
                // 格式 YYYY-MM-DD 提取 MM/DD
                const month = parts[1].padStart(2, '0');
                const day = parts[2].padStart(2, '0');
                return `${month}/${day}`;
            } else if (parts.length === 2) {
                // 格式 MM-DD 补齐前导 0
                const month = parts[0].padStart(2, '0');
                const day = parts[1].padStart(2, '0');
                return `${month}/${day}`;
            }
            
            return dateStr;
        }

        function parseExcel(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        // 读取第一个工作表
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        // 转换为 JSON 对象数组
                        const json = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                        resolve(json);
                    } catch (err) {
                        reject("Excel解析失败: " + err.message);
                    }
                };
                reader.onerror = () => reject("文件读取失败");
                reader.readAsArrayBuffer(file);
            });
        }

        function formatLabel(value) {
            const num = parseFloat(value);
            if (isNaN(num) || num === 0) return num; // 如果是 0 也直接返回 0
            if (num >= 1000) {
                let formatted = (num / 1000).toFixed(1);
                if (formatted.endsWith('.0')) formatted = formatted.slice(0, -2);
                return formatted + 'k';
            }
            return num;
        }

        function showMessage(msg, isError = true) {
            const statusEl = document.getElementById('statusMsg');
            statusEl.textContent = msg;
            statusEl.className = `mt-3 text-sm font-medium ${isError ? 'text-red-500' : 'text-green-500'}`;
            statusEl.classList.remove('hidden');
        }

        document.getElementById('generateBtn').addEventListener('click', async () => {
            const consultFile = document.getElementById('consultFile').files[0];
            const misjudgeFile = document.getElementById('misjudgeFile').files[0];
            const batchDownloadBtn = document.getElementById('batchDownloadBtn');

            if (!consultFile || !misjudgeFile) {
                showMessage('请先上传 咨询与申诉量 和 误判量 两个 Excel 文件！');
                return;
            }

            showMessage('正在解析 Excel 数据并生成图表...', false);
            const container = document.getElementById('chartsContainer');
            container.innerHTML = '';
            const navContainer = document.getElementById('countryNav');
            navContainer.innerHTML = '';
            
            generatedCharts = [];
            batchDownloadBtn.classList.add('hidden');

            try {
                const consultData = await parseExcel(consultFile);
                const misjudgeData = await parseExcel(misjudgeFile);

                const countryMap = {};
                const allWeeksSet = new Set();

                // 处理咨询与申诉量数据
                consultData.forEach(row => {
                    const rawWeek = getColumnValue(row, ['week_range', '周']);
                    const week = formatExcelDate(rawWeek); // ✨ 使用新的格式化函数
                    
                    const country = String(getColumnValue(row, ['guanbao_area_name', '国家']) || "").trim();
                    const value = parseInt(getColumnValue(row, ['_col0', '咨询与申诉量', '咨询量'])) || 0;
                    
                    if (!week || !country) return;

                    if (!countryMap[country]) countryMap[country] = {};
                    if (!countryMap[country][week]) countryMap[country][week] = { consult: 0, machineMisjudge: 0, humanMisjudge: 0 };
                    
                    countryMap[country][week].consult += value;
                    allWeeksSet.add(week);
                });

                // 处理误判量数据
                misjudgeData.forEach(row => {
                    const rawWeek = getColumnValue(row, ['week_start', '周']);
                    const week = formatExcelDate(rawWeek); // ✨ 使用新的格式化函数
                    
                    const country = String(getColumnValue(row, ['guanbao_area_name', '国家']) || "").trim();
                    const value = parseInt(getColumnValue(row, ['cnt', '误判量'])) || 0;
                    const auditType = String(getColumnValue(row, ['audit_type', '类型']) || "").trim();

                    if (!week || !country) return;

                    if (!countryMap[country]) countryMap[country] = {};
                    if (!countryMap[country][week]) countryMap[country][week] = { consult: 0, machineMisjudge: 0, humanMisjudge: 0 };
                    
                    if (auditType.includes('机审')) {
                        countryMap[country][week].machineMisjudge += value;
                    } else if (auditType.includes('人审')) {
                        countryMap[country][week].humanMisjudge += value;
                    } else {
                        countryMap[country][week].machineMisjudge += value;
                    }

                    allWeeksSet.add(week);
                });

                // 因为已经全部格式化为了 MM/DD，直接排序即可
                const sortedWeeks = Array.from(allWeeksSet).sort();
                
                const countries = Object.keys(countryMap).sort((a, b) => a.localeCompare(b, 'zh-CN'));
                
                if (countries.length === 0) {
                    showMessage('未在文件中找到有效数据，请检查列名是否正确。');
                    return;
                }

                // 快速导航
                countries.forEach((country, index) => {
                    const btn = document.createElement('a');
                    btn.href = `#chart-${index}`;
                    btn.className = 'px-3 py-1 bg-white border border-[#2e95db] text-[#2e95db] text-sm rounded-full hover:bg-[#2e95db] hover:text-white transition';
                    btn.textContent = country;
                    navContainer.appendChild(btn);
                });

                // 渲染图表
                countries.forEach((country, index) => {
                    const card = document.createElement('div');
                    card.id = `chart-${index}`;
                    card.className = 'bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center overflow-x-auto max-w-full scroll-mt-6';
                    
                    const chartWidth = Math.max(454, sortedWeeks.length * 30);
                    const chartDiv = document.createElement('div');
                    chartDiv.style.width = chartWidth + 'px';
                    chartDiv.style.height = '378px';
                    card.appendChild(chartDiv);

                    const downloadBtn = document.createElement('button');
                    downloadBtn.className = 'mt-4 px-4 py-2 border-2 border-[#2e95db] text-[#2e95db] text-sm font-semibold rounded hover:bg-[#2e95db] hover:text-white transition duration-200 flex items-center space-x-2';
                    downloadBtn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg><span>下载 ${country} 高清PNG</span>`;
                    card.appendChild(downloadBtn);
                    container.appendChild(card);

                    const xData = [];
                    const cData = [];
                    const mDataMachine = [];
                    const mDataHuman = [];

                    sortedWeeks.forEach(week => {
                        xData.push(week); // ✨ 直接推送格式化好的日期
                        const dataObj = countryMap[country][week] || { consult: 0, machineMisjudge: 0, humanMisjudge: 0 };
                        cData.push(dataObj.consult);
                        mDataMachine.push(dataObj.machineMisjudge);
                        mDataHuman.push(dataObj.humanMisjudge);
                    });

                    const chart = echarts.init(chartDiv);
                    chart.setOption({
                        backgroundColor: '#ffffff',
                        title: { text: country, left: '10', top: '10', textStyle: { color: '#000000', fontSize: 16, fontWeight: 'bold' } },
                        tooltip: { trigger: 'axis' },
                        legend: { data: ['咨询与申诉量', '机审-误判', '人审-误判'], top: '10', right: '10' }, 
                        grid: { left: '2%', right: '2%', bottom: '5%', top: '60', containLabel: true },
                        xAxis: { 
                            type: 'category', 
                            data: xData, 
                            axisLabel: { color: THEME_BLUE, rotate: 0, fontSize: 11 }, 
                            axisLine: { lineStyle: { color: THEME_BLUE } } 
                        },
                        yAxis: [
                            { 
                                type: 'value', 
                                // 动态缩放：取当前数据最大值并乘以 1.2，确保顶部留有空间
                                max: (value) => value.max > 0 ? Math.ceil(value.max * 1.2) : 10, 
                                min: 0, // 锁定下限
                                axisLabel: { color: THEME_BLUE, fontSize: 10 }, 
                                splitLine: { lineStyle: { opacity: 0.15, type: 'dashed', color: THEME_BLUE } } 
                            },
                            { 
                                type: 'value', 
                                position: 'right',
                                min: 0, // 锁定下限，防止沉底
                                // 动态拉伸右侧 Y 轴：使其最大值为实际最大值的 3.5 倍。
                                // 这样误判折线就会被压在整个画布的下三分之一处。
                                max: (value) => Math.max(value.max * 3.5, 10), 
                                axisLabel: { color: MACHINE_COLOR, fontSize: 10 }, 
                                splitLine: { show: false }
                            }
                        ],
                        series: [
                            { 
                                name: '咨询与申诉量', 
                                type: 'line', 
                                data: cData, 
                                yAxisIndex: 0,
                                itemStyle: { color: THEME_BLUE }, 
                                label: { show: true, position: 'top', formatter: (p) => formatLabel(p.value), fontSize: 10, fontWeight: 'bold' } 
                            },
                            { 
                                name: '机审-误判', 
                                type: 'line', 
                                data: mDataMachine, 
                                yAxisIndex: 1, // 使用右侧 Y 轴
                                itemStyle: { color: MACHINE_COLOR }, 
                                label: { show: true, position: 'top', formatter: (p) => formatLabel(p.value), fontSize: 10, fontWeight: 'bold' } 
                            },
                            { 
                                name: '人审-误判', 
                                type: 'line', 
                                data: mDataHuman, 
                                yAxisIndex: 1, // 使用右侧 Y 轴
                                itemStyle: { color: HUMAN_COLOR }, 
                                label: { show: true, position: 'top', formatter: (p) => formatLabel(p.value), fontSize: 10, fontWeight: 'bold' } 
                            }
                        ]
                    });
                    
                    const fileName = `${country}_数据折线图.png`;
                    generatedCharts.push({ instance: chart, fileName: fileName });

                    downloadBtn.addEventListener('click', () => {
                        const url = chart.getDataURL({ type: 'png', pixelRatio: 4, backgroundColor: '#ffffff' });
                        const a = document.createElement('a'); a.href = url; a.download = fileName; a.click();
                    });
                });

                showMessage(`成功生成 ${countries.length} 个地区的图表！`, false);
                if (generatedCharts.length > 0) batchDownloadBtn.classList.remove('hidden');

            } catch (error) {
                console.error(error);
                showMessage('处理文件时出错：' + error);
            }
        });

        document.getElementById('batchDownloadBtn').addEventListener('click', async function() {
            const btn = this;
            const originalText = btn.innerText;
            btn.innerText = '正在打包...'; btn.disabled = true;

            try {
                const zip = new JSZip();
                generatedCharts.forEach(item => {
                    const url = item.instance.getDataURL({ type: 'png', pixelRatio: 4, backgroundColor: '#ffffff' });
                    zip.file(item.fileName, url.split(',')[1], { base64: true });
                });
                const content = await zip.generateAsync({ type: "blob" });
                saveAs(content, "全部热线数据图表.zip");
            } catch (err) {
                alert('打包失败');
            } finally {
                btn.innerText = originalText; btn.disabled = false;
            }
        });
    </script>
</body>
</html>
