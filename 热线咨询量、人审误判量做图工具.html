<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热线数据双折线图生成器 (咨询量 & 人审误判)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-6 font-sans text-gray-800">

    <div class="max-w-6xl mx-auto space-y-6">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center text-center">
            <h1 class="text-2xl font-bold mb-2" style="color: #2e95db;">热线咨询量与人审误判量趋势</h1>
            <p class="text-gray-500 text-sm">自动解析上传的数据，生成咨询量与人审误判量的对比图表。</p>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center gap-6">
            <div class="w-full max-w-xl space-y-2">
                <label class="block text-sm font-medium text-gray-700">上传 数据表 (表格需包含“热线人审误判数”和“热线咨询量”上下两个区块，首列为月份)</label>
                <input type="file" id="dataFile" accept=".xlsx, .xls, .csv" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-[#2e95db] file:text-white hover:file:bg-[#1a7bbd] cursor-pointer border border-gray-200 rounded-md">
            </div>
            <div class="flex flex-col items-center w-full">
                <div class="flex flex-col md:flex-row space-y-3 md:space-y-0 md:space-x-4 w-full md:w-auto">
                    <button id="generateBtn" class="px-8 py-3 bg-[#2e95db] text-white font-bold rounded-lg shadow-md hover:bg-[#1a7bbd] transition duration-200 w-full md:w-auto">
                        一键生成图表
                    </button>
                    <button id="batchDownloadBtn" class="hidden px-8 py-3 bg-green-500 text-white font-bold rounded-lg shadow-md hover:bg-green-600 transition duration-200 w-full md:w-auto">
                        批量下载全部图表 (ZIP)
                    </button>
                </div>
                <p id="statusMsg" class="mt-3 text-sm text-red-500 hidden"></p>
            </div>
        </div>

        <div id="regionNav" class="flex flex-wrap gap-2 justify-center mt-4"></div>
        <div id="chartsContainer" class="flex flex-wrap gap-8 justify-center mt-4"></div>
    </div>

    <script>
        const THEME_BLUE = '#2e95db';
        const HUMAN_COLOR = '#ef4444';   // 红色表示人审
        let generatedCharts = [];

        // 增强版：支持大小写不敏感匹配中英文表头
        function getColumnValue(row, keywords) {
            if (!Array.isArray(keywords)) keywords = [keywords];
            for (let kw of keywords) {
                const key = Object.keys(row).find(k => k.trim().toLowerCase().includes(kw.toLowerCase()));
                if (key) return row[key];
            }
            return undefined;
        }

        // 月度转译器：强制提取 YYYY-MM，已适配 25-04 缩写格式
        function normalizeMonthDate(val) {
            if (val === undefined || val === null || val === "") return "";
            if (typeof val === 'number' || (!isNaN(val) && Number(val) > 20000)) {
                const utcDate = new Date(Math.round((Number(val) - 25569) * 86400 * 1000));
                const y = utcDate.getUTCFullYear();
                const m = utcDate.getUTCMonth() + 1;
                return `${y}-${m < 10 ? '0' + m : m}`;
            }
            let str = String(val).trim().replace(/\//g, '-').replace(/年/g, '-').replace(/月/g, '');
            let match = str.match(/^(\d{2,4})-(\d{1,2})/);
            if (match) {
                let y = match[1];
                if (y.length === 2) y = '20' + y;
                let m = parseInt(match[2]);
                return `${y}-${m < 10 ? '0' + m : m}`;
            }
            return str;
        }

        function parseExcel(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        // 改为输出二维数组以适配上下两块的排版
                        const json = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                        resolve(json);
                    } catch (err) {
                        reject("Excel解析失败: " + err.message);
                    }
                };
                reader.onerror = () => reject("文件读取失败");
                reader.readAsArrayBuffer(file);
            });
        }

        function formatLabel(value) {
            if (value === null || value === undefined) return '';
            if (value === 0) return '0';
            const num = parseFloat(value);
            if (isNaN(num)) return value;
            if (num >= 1000) {
                let formatted = (num / 1000).toFixed(1);
                if (formatted.endsWith('.0')) formatted = formatted.slice(0, -2);
                return formatted + 'k';
            }
            return num;
        }

        function showMessage(msg, isError = true) {
            const statusEl = document.getElementById('statusMsg');
            statusEl.textContent = msg;
            statusEl.className = `mt-3 text-sm font-medium ${isError ? 'text-red-500' : 'text-green-500'}`;
            statusEl.classList.remove('hidden');
        }

        function getSafeLogData(val) {
            if (val === null) return null;
            return {
                value: val < 1 ? 1 : val, 
                realValue: val
            };
        }

        document.getElementById('generateBtn').addEventListener('click', async () => {
            const dataFile = document.getElementById('dataFile').files[0];
            const batchDownloadBtn = document.getElementById('batchDownloadBtn');

            if (!dataFile) {
                showMessage('请先上传包含数据的 Excel 文件！');
                return;
            }

            showMessage('正在解析 Excel 数据并生成图表...', false);
            const container = document.getElementById('chartsContainer');
            container.innerHTML = '';
            const navContainer = document.getElementById('regionNav');
            navContainer.innerHTML = '';
            
            generatedCharts = [];
            batchDownloadBtn.classList.add('hidden');

            try {
                const sheetData = await parseExcel(dataFile);

                const regionMap = {};
                const allMonthsSet = new Set();

                let currentMode = null; // 'misjudge' 或 'consult'
                let regionHeaders = []; // 保存当前区块的大区列表

                // 解析包含多个区块（上下排布）的二维表数据
                sheetData.forEach(row => {
                    if (!row || row.length === 0) return;
                    
                    const firstCell = String(row[0] || '').trim();
                    
                    // 检测区块标题
                    if (firstCell.includes('人审误判')) {
                        currentMode = 'misjudge';
                        return;
                    }
                    if (firstCell.includes('咨询量')) {
                        currentMode = 'consult';
                        return;
                    }

                    // 检测表头行 (首列为月份)
                    if (firstCell === '月份' || firstCell === 'month' || firstCell === '时间') {
                        // 提取该行后面的所有列作为大区名
                        regionHeaders = row.slice(1).map(r => String(r || '').trim()).filter(r => r !== '');
                        return;
                    }

                    // 解析数据行 (在确定的区块模式下，且有大区表头，首列不为空)
                    if (currentMode && regionHeaders.length > 0 && firstCell !== '') {
                        const monthKey = normalizeMonthDate(firstCell);
                        if (!monthKey) return; 

                        regionHeaders.forEach((region, index) => {
                            // row[1] 对应 regionHeaders[0]
                            const val = parseFloat(row[index + 1]) || 0;
                            
                            if (!regionMap[region]) regionMap[region] = {};
                            if (!regionMap[region][monthKey]) regionMap[region][monthKey] = { consult: 0, misjudgeHuman: 0 };
                            
                            if (currentMode === 'misjudge') {
                                regionMap[region][monthKey].misjudgeHuman += val;
                            } else if (currentMode === 'consult') {
                                regionMap[region][monthKey].consult += val;
                            }
                        });
                        allMonthsSet.add(monthKey);
                    }
                });

                const sortedMonths = Array.from(allMonthsSet).sort();
                const parsedRegions = Object.keys(regionMap).sort((a, b) => a.localeCompare(b, 'zh-CN'));
                
                if (parsedRegions.length === 0) {
                    showMessage('未在文件中找到有效数据，请检查表格是否包含“热线人审误判数”和“热线咨询量”及相关月份数据。');
                    return;
                }

                parsedRegions.forEach((region, index) => {
                    const btn = document.createElement('a');
                    btn.href = `#chart-${index}`;
                    btn.className = 'px-3 py-1 bg-white border border-[#2e95db] text-[#2e95db] text-sm rounded-full hover:bg-[#2e95db] hover:text-white transition';
                    btn.textContent = region;
                    navContainer.appendChild(btn);
                });

                parsedRegions.forEach((region, index) => {
                    const card = document.createElement('div');
                    card.id = `chart-${index}`;
                    card.className = 'bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center overflow-x-auto max-w-full scroll-mt-6';
                    
                    const chartWidth = Math.max(850, sortedMonths.length * 60); 
                    const chartDiv = document.createElement('div');
                    chartDiv.style.width = chartWidth + 'px';
                    chartDiv.style.height = '480px'; 
                    card.appendChild(chartDiv);

                    const downloadBtn = document.createElement('button');
                    downloadBtn.className = 'mt-4 px-4 py-2 border-2 border-[#2e95db] text-[#2e95db] text-sm font-semibold rounded hover:bg-[#2e95db] hover:text-white transition duration-200 flex items-center space-x-2';
                    downloadBtn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg><span>下载 ${region} 高清PNG</span>`;
                    card.appendChild(downloadBtn);
                    container.appendChild(card);

                    const xData = [];
                    const cData = [];
                    const mHumanData = [];

                    sortedMonths.forEach((month) => {
                        xData.push(month);
                        
                        const dataObj = regionMap[region][month] || { consult: 0, misjudgeHuman: 0 };
                        
                        cData.push(getSafeLogData(dataObj.consult));
                        mHumanData.push(getSafeLogData(dataObj.misjudgeHuman));
                    });

                    const chart = echarts.init(chartDiv);
                    chart.setOption({
                        backgroundColor: '#ffffff',
                        title: { 
                            text: region, 
                            left: '10', 
                            top: '10', 
                            textStyle: { color: '#000000', fontSize: 20, fontWeight: 'bold' } 
                        },
                        tooltip: { 
                            trigger: 'axis',
                            textStyle: { fontSize: 14 }, 
                            formatter: function (params) {
                                let html = params[0].axisValue + ' 月份<br/>';
                                params.forEach(p => {
                                    if (p.data === null || p.data === undefined) return;
                                    const realVal = p.data.realValue !== undefined ? p.data.realValue : '-';
                                    html += `${p.marker} ${p.seriesName}: <span style="font-weight:bold">${realVal}</span><br/>`;
                                });
                                return html;
                            }
                        },
                        legend: { 
                            data: ['咨询量', '人审误判量'], 
                            top: 15, 
                            right: 60,
                            itemWidth: 25, itemHeight: 14, 
                            textStyle: { fontSize: 14, fontWeight: 'bold' } 
                        },
                        grid: { left: 60, right: 60, bottom: 60, top: 90, containLabel: true },
                        xAxis: { 
                            type: 'category',
                            name: '月份',
                            nameTextStyle: {
                                color: THEME_BLUE,
                                fontWeight: 'bold',
                                fontSize: 13
                            },
                            data: xData, 
                            axisLabel: { color: THEME_BLUE, rotate: 45, fontSize: 13, fontWeight: 'bold' }, 
                            axisLine: { lineStyle: { color: THEME_BLUE } } 
                        },
                        yAxis: {
                            type: 'log',
                            min: 1, 
                            logBase: 10,
                            axisLabel: { 
                                color: THEME_BLUE, 
                                fontSize: 12, 
                                fontWeight: 'bold',
                                formatter: function (value) {
                                    if (value === 1) return '0';
                                    return formatLabel(value);
                                }
                            },
                            splitLine: { lineStyle: { opacity: 0.15, type: 'dashed', color: THEME_BLUE } }
                        },
                        series: [
                            { 
                                name: '咨询量', 
                                type: 'line', 
                                data: cData, 
                                symbolSize: 8, 
                                itemStyle: { color: THEME_BLUE }, 
                                label: { 
                                    show: true, 
                                    position: 'top', 
                                    color: THEME_BLUE,
                                    textBorderColor: '#ffffff',
                                    textBorderWidth: 4, 
                                    formatter: (p) => formatLabel(p.data.realValue), 
                                    fontSize: 16, 
                                    fontWeight: 'bold' 
                                },
                                labelLayout: { moveOverlap: 'shiftY' } 
                            },
                            { 
                                name: '人审误判量', 
                                type: 'line', 
                                data: mHumanData, 
                                symbolSize: 8,
                                itemStyle: { color: HUMAN_COLOR }, 
                                label: { 
                                    show: true, 
                                    position: 'bottom', // 避免和顶部的咨询量标签重叠
                                    color: HUMAN_COLOR, 
                                    textBorderColor: '#ffffff',
                                    textBorderWidth: 4,
                                    formatter: (p) => formatLabel(p.data.realValue), 
                                    fontSize: 16, 
                                    fontWeight: 'bold' 
                                },
                                labelLayout: { moveOverlap: 'shiftY' } 
                            }
                        ]
                    });
                    
                    const fileName = `${region}_咨询与人审误判对比图.png`;
                    generatedCharts.push({ instance: chart, fileName: fileName });

                    downloadBtn.addEventListener('click', () => {
                        const url = chart.getDataURL({ type: 'png', pixelRatio: 4, backgroundColor: '#ffffff' });
                        const a = document.createElement('a'); a.href = url; a.download = fileName; a.click();
                    });
                });

                showMessage(`成功生成 ${parsedRegions.length} 个大区的图表！`, false);
                if (generatedCharts.length > 0) batchDownloadBtn.classList.remove('hidden');

            } catch (error) {
                console.error(error);
                showMessage('处理文件时出错：' + error);
            }
        });

        document.getElementById('batchDownloadBtn').addEventListener('click', async function() {
            const btn = this;
            const originalText = btn.innerText;
            btn.innerText = '正在打包...'; btn.disabled = true;

            try {
                const zip = new JSZip();
                generatedCharts.forEach(item => {
                    const url = item.instance.getDataURL({ type: 'png', pixelRatio: 4, backgroundColor: '#ffffff' });
                    zip.file(item.fileName, url.split(',')[1], { base64: true });
                });
                const content = await zip.generateAsync({ type: "blob" });
                saveAs(content, "全部热线对比图_双线版.zip");
            } catch (err) {
                alert('打包失败');
            } finally {
                btn.innerText = originalText; btn.disabled = false;
            }
        });
    </script>
</body>
</html>
